plugins {
    id "java"
    id "dev.architectury.loom" version "+" apply false
    id "architectury-plugin" version "+"
}

group "org.eu.awesomekalin.jta"
version rootProject.properties.version

architectury {
    minecraft = project.properties.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'   // Ensure Loom plugin is applied
    apply plugin: 'architectury-plugin'

    version = rootProject.version + "+" + rootProject.properties.minecraft_version
    group = rootProject.maven_group

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.terraformersmc.com/" } // Mod Menu
        flatDir { dirs "../libs" }
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    configurations {
        shadowBundle
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.properties.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.properties.parchment_minecraft_version}:${rootProject.properties.parchment_version}@zip")
        }
        modImplementation "net.fabricmc:fabric-loader:${rootProject.properties.fabric_loader_version}"  // Correct usage of modImplementation
        implementation "mtr:mtr-common:${rootProject.properties.mtr_version}"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }
}
